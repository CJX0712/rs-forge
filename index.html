<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RSForge — Reed-Solomon 纠错锻造炉</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
    --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; --bad:#f85149; --parity:#d2a8ff; --fix:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 "Cascadia Code",Consolas,"Microsoft YaHei",monospace;padding:24px}
  h1{font-size:20px;margin-bottom:4px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  label{color:var(--dim);font-size:12px}
  input[type=text]{flex:1;min-width:260px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--fg);padding:8px 12px;font:inherit;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  input[type=range]{accent-color:var(--accent)}
  button{background:#21262d;border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-bottom:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  #grid{display:flex;flex-wrap:wrap;gap:3px;font-size:11px}
  .cell{width:44px;padding:3px 0;text-align:center;border-radius:4px;border:1px solid transparent}
  .c-msg{background:#0d2240;color:#79b8ff;border-color:#1f3a5f}
  .c-par{background:#241436;color:#d2a8ff;border-color:#3b2660}
  .c-err{background:#3d1114;color:#ff7b72;border-color:#6e2226;font-weight:bold}
  .c-fix{background:#0f2e17;color:#56d364;border-color:#1f4d28;font-weight:bold}
  .status{font-size:13px;min-height:22px;margin-top:10px}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--dim)}
  #selftest{font-size:12px}
  #selftest .t{display:flex;gap:8px;padding:2px 0}
  .t .pass{color:var(--ok)} .t .fail{color:var(--bad)}
  footer{color:var(--dim);font-size:11px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<h1>RS<span>Forge</span> — Reed-Solomon 纠错锻造炉</h1>
<div class="sub">GF(256) · 系统码编码 · Berlekamp-Massey + Chien 搜索 + 高斯消元纠幅 · 零依赖 · 离线单文件</div>

<div class="panel">
  <div class="row">
    <label>消息</label>
    <input type="text" id="msg" value="Hello, Reed-Solomon! 晨星 ✦" spellcheck="false">
    <span class="dim" id="lenInfo"></span>
  </div>
  <div class="row">
    <label>校验符号 nsym = <b id="nsymV">8</b>（可纠 t = <b id="tV">4</b> 个字节错误）</label>
    <input type="range" id="nsym" min="2" max="16" step="2" value="8">
  </div>
  <div class="row">
    <button id="btnEncode">编码</button>
    <button id="btnCorrupt">注入 t 个随机错误</button>
    <button id="btnDecode">解码纠错</button>
    <button id="btnReset">还原</button>
  </div>
  <div class="legend">
    <span><i style="background:#0d2240;border-color:#1f3a5f"></i>消息字节</span>
    <span><i style="background:#241436;border-color:#3b2660"></i>校验字节</span>
    <span><i style="background:#3d1114;border-color:#6e2226"></i>被损坏</span>
    <span><i style="background:#0f2e17;border-color:#1f4d28"></i>已纠回</span>
  </div>
  <div id="grid"></div>
  <div class="status" id="status"></div>
</div>

<div class="panel">
  <div class="row"><b>内置自检</b><button id="runTest">重新运行</button></div>
  <div id="selftest"></div>
</div>

<footer>RSForge · GF(256) 本原多项式 0x11D · 与 QR 码/CD/DVB 同源数学 · CJX0712</footer>

<script id="engine">
const RS = (function(){
  'use strict';

  /* ---------- GF(256) with primitive polynomial 0x11D ---------- */
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function(){
    let x = 1;
    for (let i = 0; i < 255; i++){
      EXP[i] = x; LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11D;
    }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function gmul(a, b){ return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }
  function gdiv(a, b){ if (b === 0) throw new Error('GF division by zero'); return a === 0 ? 0 : EXP[(LOG[a] + 255 - LOG[b]) % 255]; }
  function ginv(a){ if (a === 0) throw new Error('GF inverse of zero'); return EXP[255 - LOG[a]]; }
  function gpow(a, n){ return EXP[(LOG[a] * n) % 255]; }
  function alphaNeg(k){ return EXP[(255 - (k % 255)) % 255]; } // α^-k

  /* ---------- generator polynomial (cached) ---------- */
  const genCache = {};
  function genPoly(nsym){
    if (genCache[nsym]) return genCache[nsym];
    let g = [1];
    for (let i = 0; i < nsym; i++){
      const ng = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++){
        ng[j] ^= g[j];            // x * g
        ng[j + 1] ^= gmul(g[j], EXP[i]); // (x - α^i)
      }
      g = ng;
    }
    genCache[nsym] = g;
    return g;
  }
  // g[0] is coefficient of x^nsym; descending order
  function polyEvalD(p, x){ // descending-coeff poly eval
    let y = 0;
    for (let i = 0; i < p.length; i++) y = gmul(y, x) ^ p[i];
    return y;
  }
  function polyEvalA(p, x){ // ascending-coeff (index = degree)
    let y = 0;
    for (let i = p.length - 1; i >= 0; i--) y = gmul(y, x) ^ p[i];
    return y;
  }

  /* ---------- systematic encode: (n,k) n = k + nsym, n ≤ 255 ---------- */
  function encode(data, nsym){
    if (!nsym || nsym < 1) throw new Error('nsym must be >= 1');
    if (data.length + nsym > 255) throw new Error('block too long: ' + (data.length + nsym) + ' > 255');
    const gen = genPoly(nsym);
    const buf = new Uint8Array(data.length + nsym);
    buf.set(data, 0);
    for (let i = 0; i < data.length; i++){
      const coef = buf[i];
      if (coef !== 0)
        for (let j = 1; j < gen.length; j++)
          buf[i + j] ^= gmul(gen[j], coef);
    }
    // buf[0..k-1] now holds the division quotient (garbage) — restore message, keep remainder parity
    const par = Array.from(buf.slice(data.length));
    buf.set(data, 0);
    for (let j = 0; j < nsym; j++) buf[data.length + j] = par[j];
    return buf;
  }

  /* ---------- syndromes: S_j = C(α^j), j = 0..nsym-1 ---------- */
  function syndromes(cw, nsym){
    const S = new Array(nsym);
    for (let j = 0; j < nsym; j++) S[j] = polyEvalD(cw, EXP[j]);
    return S;
  }

  /* ---------- Berlekamp-Massey (ascending Λ, Λ[0]=1) ---------- */
  function errorLocator(S, nsym){
    let L = [1], B = [1], l = 0, m = 1, b = 1;
    for (let n = 0; n < nsym; n++){
      let d = S[n];
      for (let i = 1; i <= l; i++) d ^= gmul(L[i] !== undefined ? L[i] : 0, S[n - i]);
      if (d === 0){ m++; continue; }
      const coef = gmul(d, ginv(b));
      if (2 * l <= n){
        const T = L.slice();
        for (let i = 0; i < B.length; i++){
          const v = gmul(coef, B[i]);
          L[m + i] = (L[m + i] !== undefined ? L[m + i] : 0) ^ v;
        }
        l = n + 1 - l; B = T; b = d; m = 1;
      } else {
        for (let i = 0; i < B.length; i++){
          const v = gmul(coef, B[i]);
          L[m + i] = (L[m + i] !== undefined ? L[m + i] : 0) ^ v;
        }
        m++;
      }
    }
    return { loc: L, deg: l };
  }

  /* ---------- Chien search: positions i where Λ(α^-(n-1-i)) == 0 ---------- */
  function chien(loc, n){
    const pos = [];
    for (let i = 0; i < n; i++){
      if (polyEvalA(loc, alphaNeg(n - 1 - i)) === 0) pos.push(i);
    }
    return pos;
  }

  /* ---------- error magnitudes: solve S_j = Σ e_i·X_i^j (Gaussian elim in GF) ---------- */
  function magnitudes(pos, S, nsym, n){
    const e = pos.length;
    const X = pos.map(i => EXP[(n - 1 - i) % 255]);
    // build e×e system from first e syndromes
    const A = [];
    for (let r = 0; r < e; r++){
      const row = [];
      for (let c = 0; c < e; c++) row.push(gpow(X[c], r)); // X[c] always nonzero; gpow(1,r)=1 via LOG[1]=0
      row.push(S[r]);
      A.push(row);
    }
    // note: gpow needs a valid log operand; X[c] is always nonzero EXP value, handle X=1 via LOG[1]=0 → gpow(1,r)=1 ok
    // gaussian elimination
    for (let col = 0; col < e; col++){
      let piv = -1;
      for (let r = col; r < e; r++) if (A[r][col] !== 0){ piv = r; break; }
      if (piv < 0) throw new Error('singular magnitude system');
      const tmp = A[col]; A[col] = A[piv]; A[piv] = tmp;
      const invP = ginv(A[col][col]);
      for (let c2 = col; c2 <= e; c2++) A[col][c2] = gmul(A[col][c2], invP); // normalize pivot row to 1
      for (let r = 0; r < e; r++){
        if (r === col || A[r][col] === 0) continue;
        const f = A[r][col];
        for (let c2 = col; c2 <= e; c2++) A[r][c2] ^= gmul(f, A[col][c2]);
      }
    }
    return pos.map((_, i) => {
      // after full elimination A[i][i]=1, A[i][e]=value
      return A[i][e];
    });
  }

  /* ---------- full correct pipeline ---------- */
  function correct(cw, nsym){
    const n = cw.length;
    const S = syndromes(cw, nsym);
    if (S.every(s => s === 0)) return { bytes: new Uint8Array(cw), errPos: [], ok: true, clean: true };
    const bm = errorLocator(S, nsym);
    if (bm.deg > Math.floor(nsym / 2)) return { bytes: null, errPos: [], ok: false, reason: 'too many errors (deg=' + bm.deg + ')' };
    const pos = chien(bm.loc, n);
    if (pos.length !== bm.deg) return { bytes: null, errPos: pos, ok: false, reason: 'chien roots ' + pos.length + ' != deg ' + bm.deg };
    let mags;
    try { mags = magnitudes(pos, S, nsym, n); }
    catch (e){ return { bytes: null, errPos: pos, ok: false, reason: e.message }; }
    const out = new Uint8Array(cw);
    for (let k = 0; k < pos.length; k++) out[pos[k]] ^= mags[k];
    const S2 = syndromes(out, nsym);
    if (!S2.every(s => s === 0)) return { bytes: null, errPos: pos, ok: false, reason: 'post-correction syndromes nonzero' };
    return { bytes: out, errPos: pos, ok: true, clean: false, mags };
  }

  function strToBytes(s){
    const arr = new Uint8Array(new TextEncoder().encode(s));
    return arr;
  }
  function bytesToStr(b){ return new TextDecoder().decode(b); }
  function hex(b){ return Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(' '); }

  return { EXP, LOG, gmul, gdiv, ginv, gpow, alphaNeg, genPoly, polyEvalD, polyEvalA,
           encode, syndromes, errorLocator, chien, magnitudes, correct,
           strToBytes, bytesToStr, hex };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = RS;
</script>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  let nsym = 8, orig = null, cur = null, fixedPos = new Set();

  function renderGrid(){
    const g = $('grid');
    g.innerHTML = '';
    if (!cur){ g.innerHTML = '<span class="dim">点击「编码」开始</span>'; return; }
    cur.forEach((b, i) => {
      const d = document.createElement('div');
      const k = i < orig.length - nsym ? 'msg' : 'par';
      let cls = 'cell c-' + k, tip = (k === 'msg' ? '消息' : '校验') + ' #' + i;
      if (fixedPos.has(i)){ cls = 'cell c-fix'; tip = '已纠回 #' + i; }
      else if (orig && b !== orig[i]){ cls = 'cell c-err'; tip = '已损坏 #' + i; }
      d.className = cls;
      d.textContent = b.toString(16).padStart(2, '0');
      d.title = tip;
      g.appendChild(d);
    });
    $('lenInfo').textContent = orig ? orig.length + ' 字节（n=' + orig.length + ', k=' + (orig.length - nsym) + '）' : '';
  }

  function doEncode(){
    const bytes = RS.strToBytes($('msg').value);
    const maxK = 255 - nsym;
    if (bytes.length > maxK){
      $('status').className = 'status bad';
      $('status').textContent = '消息过长：' + bytes.length + ' 字节 > ' + maxK + '（RS 码字上限 255）';
      return;
    }
    orig = RS.encode(bytes, nsym);
    cur = new Uint8Array(orig);
    fixedPos.clear();
    $('status').className = 'status dim';
    $('status').textContent = '已编码：n=' + orig.length + '，k=' + (orig.length - nsym) + '，纠错能力 t=' + Math.floor(nsym / 2);
    renderGrid();
  }
  function doCorrupt(){
    if (!cur){ return; }
    const t = Math.floor(nsym / 2);
    const idxs = [];
    while (idxs.length < t){
      const i = Math.floor(Math.random() * cur.length);
      if (idxs.indexOf(i) === -1) idxs.push(i);
    }
    for (const i of idxs){
      let v; do { v = Math.floor(Math.random() * 256); } while (v === cur[i]);
      cur[i] = v;
    }
    fixedPos.clear();
    $('status').className = 'status dim';
    $('status').textContent = '已损坏 ' + t + ' 个字节：位置 ' + idxs.join(', ');
    renderGrid();
  }
  function doDecode(){
    if (!cur){ return; }
    const t0 = Date.now();
    const r = RS.correct(cur, nsym);
    const ms = Date.now() - t0;
    if (!r.ok){
      $('status').className = 'status bad';
      $('status').textContent = '✗ 纠错失败：' + (r.reason || '超出纠错能力');
      renderGrid();
      return;
    }
    const injected = [];
    cur.forEach((b, i) => { if (b !== orig[i]) injected.push(i); });
    const found = r.errPos.slice().sort((a, b) => a - b);
    const match = injected.length === found.length && injected.every((v, i) => v === found[i]);
    fixedPos = new Set(found);
    cur = r.bytes;
    const txt = RS.bytesToStr(r.bytes.slice(0, orig.length - nsym));
    $('status').className = 'status ok';
    $('status').textContent = (r.clean ? '码字无损，无需纠错' : '✓ 纠回 ' + found.length + ' 个错误 @ [' + found.join(', ') + ']，位置判定' + (match ? '与注入一致' : '与注入不符!')) + ' · ' + ms + 'ms · 还原文：「' + txt + '」';
    renderGrid();
  }

  $('nsym').addEventListener('input', e => {
    nsym = +e.target.value;
    $('nsymV').textContent = nsym;
    $('tV').textContent = Math.floor(nsym / 2);
    doEncode();
  });
  $('msg').addEventListener('change', doEncode);
  $('btnEncode').addEventListener('click', doEncode);
  $('btnCorrupt').addEventListener('click', doCorrupt);
  $('btnDecode').addEventListener('click', doDecode);
  $('btnReset').addEventListener('click', () => { if (orig){ cur = new Uint8Array(orig); fixedPos.clear(); $('status').className='status dim'; $('status').textContent='已还原为原始码字'; renderGrid(); } });

  /* ---------- in-page self-test ---------- */
  function T(name, ok, msg){ return { name, ok, msg }; }
  function selfTest(){
    const out = [];
    try {
      let ok = true;
      for (let a = 1; a < 256; a++) if (RS.EXP[RS.LOG[a]] !== a) { ok = false; break; }
      out.push(T('GF 对数表往返 EXP[LOG[x]]=x (255 项)', ok));
      ok = true;
      for (let a = 1; a < 256 && ok; a++) if (RS.gmul(a, RS.ginv(a)) !== 1) ok = false;
      out.push(T('乘法逆元 a·a⁻¹=1 (255 项)', ok));
      ok = true;
      const g = RS.genPoly(10);
      for (let j = 0; j < 10 && ok; j++) if (RS.polyEvalD(g, RS.EXP[j]) !== 0) ok = false;
      out.push(T('生成多项式在 α⁰..α⁹ 全零点', ok));
      const msg = RS.strToBytes('closed loop test');
      const cw = RS.encode(msg, 8);
      out.push(T('系统码：前 k 字节 = 原消息', cw.slice(0, msg.length).every((b, i) => b === msg[i]) && cw.length === msg.length + 8));
      out.push(T('无损码字综合症全零', RS.syndromes(cw, 8).every(s => s === 0)));
      // closed loop: 300 random corruption trials
      let seed = 7;
      const rng = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      ok = true; let trials = 0, maxErr = 0;
      for (let k = 0; k < 300; k++){
        const len = 5 + Math.floor(rng() * 60);
        const ns = [4, 6, 8, 10][Math.floor(rng() * 4)];
        const data = new Uint8Array(len);
        for (let i = 0; i < len; i++) data[i] = Math.floor(rng() * 256);
        const c = RS.encode(data, ns);
        const t = Math.floor(ns / 2);
        const e = Math.floor(rng() * (t + 1));
        const pos = [];
        while (pos.length < e){ const p = Math.floor(rng() * c.length); if (pos.indexOf(p) === -1) pos.push(p); }
        const dirty = new Uint8Array(c);
        for (const p of pos){ let v; do { v = Math.floor(rng() * 256); } while (v === dirty[p]); dirty[p] = v; }
        const r = RS.correct(dirty, ns);
        trials++;
        if (e === 0) continue;
        if (!r.ok){ ok = false; break; }
        if (Array.from(r.bytes).some((b, i) => b !== c[i])){ ok = false; break; }
        if (r.errPos.length !== pos.length){ ok = false; break; }
        maxErr = Math.max(maxErr, e);
      }
      out.push(T('闭环纠错 ' + trials + ' 例随机注入 → 精确还原', ok, 'max e=' + maxErr));
      // exhaustive single-error positions
      ok = true;
      for (let p = 0; p < cw.length && ok; p++){
        const dirty = new Uint8Array(cw); dirty[p] ^= 0xA5;
        const r = RS.correct(dirty, 8);
        if (!r.ok || Array.from(r.bytes).some((b, i) => b !== cw[i])) ok = false;
      }
      out.push(T('逐位置单错穷举还原（' + cw.length + ' 位）', ok));
      out.push(T('确定性：同输入两次编码字节一致', (() => {
        const a = RS.encode(msg, 8), b = RS.encode(msg, 8);
        return a.length === b.length && Array.from(a).every((v, i) => v === b[i]);
      })()));
    } catch (e){
      out.push(T('selftest crashed', false, e.message));
    }
    $('selftest').innerHTML = out.map(r =>
      '<div class="t"><span class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✓' : '✗') + '</span>' +
      '<span>' + r.name + '</span>' + (r.msg ? '<span class="dim">' + r.msg + '</span>' : '') + '</div>').join('');
  }
  $('runTest').addEventListener('click', selfTest);

  doEncode();
  selfTest();
})();
</script>
</body>
</html>
